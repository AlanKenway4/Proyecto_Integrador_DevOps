name: Fase III - Vault Demo

on:
  workflow_dispatch:

jobs:
  vault-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Leer credenciales de Docker Hub desde Vault
        id: vault-secrets
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_ADDR }}
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            secret/data/online-boutique/dockerhub username | DOCKERHUB_USERNAME ;
            secret/data/online-boutique/dockerhub token | DOCKERHUB_TOKEN ;

      - name: Comprobar que Vault entrego las credenciales
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ steps.vault-secrets.outputs.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ steps.vault-secrets.outputs.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
          echo "Credenciales recibidas correctamente desde Vault"

      - name: Login real a Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ steps.vault-secrets.outputs.DOCKERHUB_USERNAME }}
          password: ${{ steps.vault-secrets.outputs.DOCKERHUB_TOKEN }}